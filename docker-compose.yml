version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vehicleshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vehicleshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vehicleshield_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vehicleshield} -d ${POSTGRES_DB:-vehicleshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & AI/CV Inference Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehicleshield-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vehicleshield}:${POSTGRES_PASSWORD:-secure_db_pass_2026}@db:5432/${POSTGRES_DB:-vehicleshield_db}
      - SECRET_KEY=${SECRET_KEY:-vehicleshield-super-secret-key-change-in-production-2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  # 3. Frontend & Nginx Gateway
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vehicleshield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
